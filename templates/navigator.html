{% extends 'base.html' %}
{% block title %}AX EHS Navigator{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/navigator.css') }}">
<main class="navigator" id="navigator" data-api="{{ url_for('navigator.dashboard_data') }}" aria-busy="true">
  <header class="nv-heading">
    <div><h1>AX EHS Navigator</h1><span>대시보드 · 현재 업무 이행 현황</span></div>
    <div class="nv-meta"><span id="nv-time"></span><span id="nv-sample" hidden>예시 데이터</span></div>
  </header>
  <div id="nv-message" role="status">현황을 불러오는 중입니다.</div>
  <section class="nv-kpis" id="nv-kpis" aria-label="전체 업무 현황"></section>
  <section class="nv-middle">
    <article class="nv-card nv-panel"><header><h2>업무별 현황</h2><button data-dialog="work" class="nv-link">전체 보기 ›</button></header><div id="nv-legend" class="nv-legend"></div><div id="nv-work" class="nv-bars"></div></article>
    <article class="nv-card nv-panel"><header><div><h2>사업장별 업무 현황</h2><p class="nv-caption">사업장 단위 업무 기준</p></div><button data-dialog="sites" class="nv-link">전체 보기 ›</button></header><div id="nv-sites" class="nv-table-wrap"></div></article>
    <article class="nv-card nv-panel"><header><h2>Gate 업무 현황</h2></header><div class="nv-gate"><div class="nv-donut" id="nv-donut" role="img" aria-label="Gate 현황"><div><span>전체</span><strong id="nv-gate-total">—</strong></div></div><div class="nv-gate-legend"><p><span class="nv-dot" style="background:#32a56a"></span>완료 <strong id="nv-gate-completed">—</strong></p><p><span class="nv-dot" style="background:#ef5350"></span>미완료 <strong id="nv-gate-incomplete">—</strong></p></div></div></article>
  </section>
  <section class="nv-bottom">
    <article class="nv-card nv-panel"><header class="nv-exceptions-header"><h2>비정상 진행 현황</h2><span id="nv-exception-count" class="nv-muted"></span><div class="nv-panel-actions"><button type="button" id="nv-download" class="nv-excel-download" data-export="{{ url_for('navigator.export_exceptions') }}" disabled><img src="{{ url_for('static', filename='icons/excel-icon.png') }}" width="16" height="16" alt="" aria-hidden="true"><span id="nv-download-label">엑셀 다운로드</span></button><button data-dialog="exceptions" class="nv-link">전체 보기 ›</button></div></header><div id="nv-exceptions" class="nv-table-wrap"></div></article>
    <article class="nv-card nv-panel"><header><h2>협력사 상태 조회</h2><form id="nv-search"><input id="nv-search-input" type="search" placeholder="협력사명 검색" aria-label="협력사명 검색" maxlength="100"><button type="submit" aria-label="협력사 검색"><i class="bi bi-search" aria-hidden="true"></i></button></form></header><div id="nv-partner" class="nv-partner"></div></article>
  </section>
</main>
<dialog id="nv-dialog" aria-labelledby="nv-dialog-title"><header><h2 id="nv-dialog-title"></h2><button id="nv-close" class="nv-link" aria-label="닫기">닫기 ✕</button></header><div id="nv-dialog-body"></div></dialog>
<script src="{{ url_for('static', filename='js/navigator.js') }}" defer></script>
{% endblock %}
