; UTF-8. 이 파일의 쿼리/상태 정의를 바꾸면 다음 조회부터 적용됩니다.
[NAVIGATOR]
; sample_postgres: 개발용 SELECT 샘플을 포탈 PostgreSQL에서 실행 (저장 없음).
; qadb: 기존 database_config.execute_SQL로 QADB 조회. 실패 시 샘플로 대체하지 않음.
source = sample_postgres
; Gate 부분집합 검증에 사용하는 완료 상태 컬럼. 화면은 각 상태를 별도로 표시합니다.
completed_columns = 완료

[STATUS_COLUMNS]
; SQL 컬럼 별칭 = 그래프 색상. 상태를 추가할 때 쿼리와 여기에 함께 추가하세요.
완료 = #32a56a
미완료 = #ef5350
기한초과 = #e5b522
진행중 = #4f83e8

[QUERIES]
; 1행 = 협력사 × 사업장 × 업무 × 담당자/부서의 중복 없는 집계.
; 아래 예시는 계약평가만 반영합니다. 이후 다른 업무를 UNION ALL로 추가 가능.
; 필수 식별 컬럼: partner_id, partner_name, site, tier, work_name,
; owner_login_id, owner_dept_id. 상태 컬럼은 STATUS_COLUMNS와 동일해야 합니다.
; gate_completed, gate_incomplete는 해당 행 업무 중 Gate 대상 부분집합입니다.
; 상태 건수는 서로 겹치지 않아야 하며 NULL/음수/소수는 허용하지 않습니다.
workload =
    SELECT 'P001' AS partner_id, '가온산업' AS partner_name, '기흥' AS site,
           '1차' AS tier, '계약평가' AS work_name,
           'navigator_demo_a' AS owner_login_id, 'NAV_DEMO' AS owner_dept_id,
           31 AS "완료", 2 AS "미완료", 1 AS "기한초과", 4 AS "진행중",
           8 AS gate_completed, 1 AS gate_incomplete
    UNION ALL
    SELECT 'P002', '한빛건설', '화성', '1차', '계약평가',
           'navigator_demo_b', 'NAV_DEMO', 25, 4, 2, 1, 6, 2
    UNION ALL
    SELECT 'P003', '미래테크', '평택', '2차', '계약평가',
           'navigator_demo_a', 'NAV_DEMO', 22, 3, 1, 1, 5, 1
    UNION ALL
    SELECT 'P004', '새롬서비스', '화성', '1차', '계약평가',
           'navigator_demo_c', 'NAV_OTHER', 18, 3, 1, 1, 4, 1

; 비정상 현황: 1행 = 조치 항목 1건. exception_id는 중복 없는 식별자.
; 담당자/부서 식별자는 권한용이며 owner_name은 화면 표시용입니다.
; query를 비우면 해당 영역은 '미연계'로 표시됩니다.
exceptions =
    SELECT 'E001' AS exception_id, 'P001' AS partner_id,
           '가온산업' AS partner_name, '기흥' AS site, '계약평가' AS work_name,
           '평가 미완료' AS issue, '미완료' AS status, '업무 미완료' AS category,
           '담당 A' AS owner_name, 'navigator_demo_a' AS owner_login_id,
           'NAV_DEMO' AS owner_dept_id
    UNION ALL
    SELECT 'E002', 'P002', '한빛건설', '화성', '계약평가',
           '요청 납기 초과', '기한초과', '납기 초과', '담당 B',
           'navigator_demo_b', 'NAV_DEMO'
    UNION ALL
    SELECT 'E003', 'P003', '미래테크', '평택', '계약평가',
           '평가 검토 대기', '진행중', '검토 대기', '담당 A',
           'navigator_demo_a', 'NAV_DEMO'
    UNION ALL
    SELECT 'E004', 'P004', '새롬서비스', '화성', '계약평가',
           '필수 조건 확인 필요', '미완료', 'Gate 미충족', '담당 C',
           'navigator_demo_c', 'NAV_OTHER'
