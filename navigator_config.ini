; UTF-8. 이 파일의 쿼리/상태 정의를 바꾸면 다음 조회부터 적용됩니다.
[NAVIGATOR]
; sample_postgres: 개발용 SELECT 샘플을 포탈 PostgreSQL에서 실행 (저장 없음).
; qadb: 기존 database_config.execute_SQL로 QADB 조회. 실패 시 샘플로 대체하지 않음.
source = sample_postgres
; Gate 부분집합 검증에 사용하는 완료 상태 컬럼. 화면은 각 상태를 별도로 표시합니다.
completed_columns = 완료

[STATUS_COLUMNS]
; SQL 컬럼 별칭 = 그래프 색상. 상태를 추가할 때 쿼리와 여기에 함께 추가하세요.
완료 = #32a56a
미완료 = #ef5350
기한초과 = #e5b522
진행중 = #4f83e8

[WORK:contract_evaluation]
name = 계약평가
; company: 업체 공통 업무. site 컬럼 불필요, 사업장 표에서 제외.
; 1행 = 협력사 × 담당자/부서. 같은 평가를 사업장마다 복제하지 마세요.
scope = company
enabled = true
; 공통 필수 컬럼: partner_id, partner_name, tier, owner_login_id, owner_dept_id,
; 그리고 STATUS_COLUMNS의 모든 상태 건수. 업무명은 위 name으로 지정합니다.
; gate_completed / gate_incomplete는 선택 사항이며 둘 다 생략하면 0입니다.
; Gate를 반환하면 완료 / 완료 외 상태의 부분집합이어야 합니다.
; 아래는 개발용 상수 SELECT입니다. 실제 계약평가 집계 쿼리로 교체하세요.
query =
    SELECT 'P001' AS partner_id, '가온산업' AS partner_name, '1차' AS tier,
           'navigator_demo_a' AS owner_login_id, 'NAV_DEMO' AS owner_dept_id,
           1 AS "완료", 0 AS "미완료", 0 AS "기한초과", 0 AS "진행중",
           1 AS gate_completed, 0 AS gate_incomplete
    UNION ALL
    SELECT 'P002', '한빛건설', '1차',
           'navigator_demo_b', 'NAV_DEMO', 0, 1, 0, 0, 0, 1
    UNION ALL
    SELECT 'P003', '미래테크', '2차',
           'navigator_demo_a', 'NAV_DEMO', 0, 0, 1, 0, 0, 1
    UNION ALL
    SELECT 'P004', '새롬서비스', '1차',
           'navigator_demo_c', 'NAV_OTHER', 0, 0, 0, 1, 0, 1

[WORK:subcontract_report]
name = 도급신고
; site: 사업장별 업무. 공통 필수 컬럼에 site를 추가합니다.
; 1행 = 협력사 × 사업장 × 담당자/부서. 신규 업무끼리 UNION ALL할 필요 없습니다.
scope = site
; 추후 실제 쿼리로 교체한 뒤 true로 바꾸세요. false면 조회/집계하지 않습니다.
enabled = false
query =
    SELECT 'P001' AS partner_id, '가온산업' AS partner_name, '기흥' AS site,
           '1차' AS tier, 'navigator_demo_a' AS owner_login_id, 'NAV_DEMO' AS owner_dept_id,
           1 AS "완료", 0 AS "미완료", 0 AS "기한초과", 0 AS "진행중"
    UNION ALL
    SELECT 'P001', '가온산업', '화성', '1차', 'navigator_demo_a', 'NAV_DEMO', 0, 0, 0, 1
    UNION ALL
    SELECT 'P002', '한빛건설', '화성', '1차', 'navigator_demo_b', 'NAV_DEMO', 0, 0, 1, 0

[WORK:joint_risk_assessment]
name = 원하청 공동위험성평가
scope = site
enabled = false
query =
    SELECT 'P001' AS partner_id, '가온산업' AS partner_name, '기흥' AS site,
           '1차' AS tier, 'navigator_demo_a' AS owner_login_id, 'NAV_DEMO' AS owner_dept_id,
           2 AS "완료", 0 AS "미완료", 0 AS "기한초과", 1 AS "진행중"
    UNION ALL
    SELECT 'P003', '미래테크', '평택', '2차', 'navigator_demo_a', 'NAV_DEMO', 0, 1, 0, 0

[QUERIES]
; 비정상 현황: 1행 = 조치 항목 1건. exception_id는 중복 없는 식별자.
; 담당자/부서 식별자는 권한용이며 owner_name은 화면 표시용입니다.
; site는 선택 사항. 업체 공통 업무는 생략하거나 빈 문자열을 반환하세요.
; exceptions를 비우면 해당 영역은 '미연계'로 표시됩니다.
exceptions =
    SELECT 'E001' AS exception_id, 'P002' AS partner_id,
           '한빛건설' AS partner_name, '계약평가' AS work_name,
           '평가 미완료' AS issue, '미완료' AS status, '업무 미완료' AS category,
           '담당 B' AS owner_name, 'navigator_demo_b' AS owner_login_id,
           'NAV_DEMO' AS owner_dept_id
    UNION ALL
    SELECT 'E002', 'P003', '미래테크', '계약평가',
           '요청 납기 초과', '기한초과', '납기 초과', '담당 A',
           'navigator_demo_a', 'NAV_DEMO'
